[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "openpod-nde"
version = "0.1.0"
description = "Independent NDE POD, censoring and ultrasonic signal analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "matplotlib>=3.7"]
[project.optional-dependencies]
validation = ["pytest>=7", "statsmodels>=0.14"]
[project.scripts]
openpod = "openpod.cli:main"
[tool.setuptools]
packages = ["openpod"]
